name: quota_admin
author: AstrBot Team
desc: 通用配额系统管理插件 - 跨平台统一交互，支持配额查询、积分管理、会员管理等功能
version: 2.0.0
repo: https://github.com/AstrBot/astrbot_plugin_quota_admin
platforms:
  - telegram
  - discord
  - lark
  - wechat
  - qq
features:
  - 跨平台统一交互（按钮模式/会话模式）
  - 配额查询和统计
  - 积分管理和兑换
  - 会员管理
  - 管理员功能
  - 速率限制查看
