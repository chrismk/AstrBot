# 签到系统配置

# 管理员列表
admins:
  - "admin_user_id_1"

# 签到奖励配置
rewards:
  # 基础签到奖励
  base_points: 10
  
  # 随机奖励范围（最小-最大）
  random_points_min: 1
  random_points_max: 20
  
  # 连续签到奖励倍数（连续天数: 倍数）
  streak_bonus:
    3: 1.2    # 连续3天，奖励x1.2
    7: 1.5    # 连续7天，奖励x1.5
    15: 2.0   # 连续15天，奖励x2.0
    30: 3.0   # 连续30天，奖励x3.0
  
  # 每月全勤奖励
  perfect_month_bonus: 200
  
  # 幸运签到概率（0-1）
  lucky_chance: 0.1
  
  # 幸运签到倍数
  lucky_multiplier: 2.0

# 补签配置
makeup:
  # 是否启用补签
  enabled: true
  
  # 补签消耗积分
  cost: 50
  
  # 最多可补签天数
  max_days: 7

# 排行榜配置
leaderboard:
  # 显示排行榜人数
  top_count: 10

# 提醒配置
reminder:
  # 是否启用签到提醒
  enabled: false
  
  # 提醒时间（24小时制）
  time: "20:00"
